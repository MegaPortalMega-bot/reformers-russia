<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справка — Реформаторы России</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<main class="page-main">
    <div class="container">
        <section class="help-page">
            <header class="help-header">
                <h1>Справка</h1>
                <p>Материалы проекта: методика оценок, обоснование состава каталога и описание сайта.</p>
                <p class="help-count" th:text="'Документов: ' + ${documentCount}">Документов: 0</p>
            </header>

            <ul class="help-documents" th:if="${documentCount > 0}">
                <li th:each="doc : ${documents}">
                    <a th:href="${doc.url}" th:text="${doc.title}" target="_blank" rel="noopener noreferrer">
                        Документ
                    </a>
                    <span class="help-documents-file" th:text="${doc.fileName}">file.docx</span>
                </li>
            </ul>

            <p class="empty-state" th:if="${documentCount == 0}">
                В папке справки пока нет документов (PDF, DOCX, TXT). Добавьте файлы в каталог проекта.
            </p>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
